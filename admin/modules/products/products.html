<div class="container-fluid">

    <!-- HEADER -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                <i class="fa-solid fa-box text-primary"></i>
                Products
            </h2>

            <p class="text-muted mb-0">
                Manage Fgshusoft Electronics inventory
            </p>

        </div>

        <button
        id="addProductBtn"
        class="btn btn-primary">

            <i class="fa-solid fa-plus"></i>

            Add Product

        </button>

    </div>


    <!-- SEARCH -->
    <div class="card border-0 shadow-sm rounded-4 mb-4">

        <div class="card-body">

            <div class="row g-3">

                <div class="col-md-6">

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="fa-solid fa-search"></i>
                        </span>

                        <input
                        id="searchProduct"
                        class="form-control"
                        placeholder="Search products...">

                    </div>

                </div>

                <div class="col-md-3">

                    <select
                    id="categoryFilter"
                    class="form-select">

                        <option value="all">
                            All Categories
                        </option>

                    </select>

                </div>

<div class="col-md-6">
<label class="form-label">
Brand
</label>
<select
id="productBrand1"
class="form-select">
<option value="">
Select brand
</option>
</select>
</div>


            </div>

        </div>

    </div>



    <!-- PRODUCTS TABLE -->
    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                        
    <tr>
         <th>Image</th>
         <th>Product</th>
         <th>Category</th>
         <th> Brand </th>
         <th>Price</th>
         <th>Stock</th>
         <th>Status</th>
         <th>Actions</th>
    </tr>

                    </thead>

                    <tbody id="productsTable">

                        <tr>

                            <td
                            colspan="8"
                            class="text-center text-muted py-4">

                                Loading products...

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>



<!-- ===================================== -->
<!-- PRODUCT MODAL -->
<!-- ===================================== -->

<div
class="modal fade"
id="productModal"
tabindex="-1">

<div class="modal-dialog modal-xl">

<div class="modal-content rounded-4">

<div class="modal-header">

<h5 class="modal-title fw-bold">

<i class="fa-solid fa-box-open text-primary"></i>

Add Product

</h5>

<button
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>



<div class="modal-body">

<div class="row g-3">

<!-- Product Name -->

<div class="col-md-6">

<label class="form-label">

Product Name

</label>

<input
id="productName"
class="form-control"
placeholder="ESP32 Development Board">

</div>


<!-- Category -->

<div class="col-md-6">

<label class="form-label">

Category

</label>

<select
id="productCategory"
class="form-select">

<option value="">
Select category
</option>

</select>

</div>



<!-- Brand -->

<div class="col-md-4">

<label class="form-label">

Brand

</label>

<!-- Brand -->
<select
id="productBrand"
class="form-select">

<option value="">
Select brand
</option>

</select>

</div>

<!-- Model -->

<div class="col-md-4">

<label class="form-label">

Model

</label>

<input
id="productModel"
class="form-control"
placeholder="ESP32-WROOM-32">

</div>



<!-- SKU -->

<div class="col-md-4">

<label class="form-label">

SKU

</label>

<input
id="productSku"
class="form-control"
placeholder="ESP32-0001">

</div>



<!-- Cost Price -->

<div class="col-md-4">

<label class="form-label">

Cost Price (FCFA)

</label>

<input
id="productCostPrice"
type="number"
class="form-control"
placeholder="3500">

</div>



<!-- Selling Price -->

<div class="col-md-4">

<label class="form-label">

Selling Price (FCFA)

</label>

<input
id="productPrice"
type="number"
class="form-control"
placeholder="5000">

</div>



<!-- Stock -->

<div class="col-md-4">

<label class="form-label">

Stock

</label>

<input
id="productStock"
type="number"
class="form-control"
placeholder="25">

</div>



<!-- Unit -->

<div class="col-md-4">

<label class="form-label">

Unit

</label>

<select
id="productUnit"
class="form-select">

<option value="Piece">Piece</option>
<option value="Pack">Pack</option>
<option value="Box">Box</option>
<option value="Meter">Meter</option>
<option value="Roll">Roll</option>
<option value="Set">Set</option>
<option value="Pair">Pair</option>
<option value="Kit">Kit</option>

</select>

</div>



<!-- Status -->

<div class="col-md-4">

<label class="form-label">

Status

</label>

<select
id="productStatus"
class="form-select">

<option value="active">
Active
</option>

<option value="inactive">
Inactive
</option>

</select>

</div>



<!-- Image -->

<div class="col-md-4">

<label class="form-label">

Product Image

</label>

<input
type="file"
id="productImage"
class="form-control"
accept="image/*">

<img
id="imagePreview"
class="img-thumbnail mt-3"
style="display:none;max-height:140px;">

</div>



<!-- Description -->

<div class="col-12">

<label class="form-label">

Description

</label>

<textarea
id="productDescription"
class="form-control"
rows="4"
placeholder="Product description..."></textarea>

</div>

</div>

</div>

<div class="modal-footer">

<button
class="btn btn-secondary"
data-bs-dismiss="modal">

Cancel

</button>

<button
id="saveProduct"
class="btn btn-primary">

<i class="fa-solid fa-save"></i>

Save Product

</button>

</div>

</div>

</div>

</div>
