<!DOCTYPE html>
<html lang="en">

<head>

<title>Fgshusoft Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/admin.css">

</head>

<body>

<div class="wrapper">

<li>
<a href="#">
<i class="fa-solid fa-box"></i>
Products
</a>
</li>

<li>
<a href="#">
<i class="fa-solid fa-tags"></i>
Categories
</a>
</li>

<li>
<a href="#">

Orders
</a>
</li>

<li>
<a href="#">

</a>
</li>

<li>
<a href="#">

</a>
</li>

<li>
<a href="#">
<i class="fa-solid fa-diagram-project"></i>

</a>
</li>

<li>
<a href="#">

</a>
</li>

<li>
<a href="#">

</a>
</li>

<li>
<a href="#">

</a>
</li>

<li class="mt-4">
<a href="login.html" class="text-danger">
<i class="fa-solid fa-right-from-bracket"></i>
Logout
</a>
</li>

</ul>

</nav>

<!-- Main -->

<div id="content">

<!-- Topbar -->

<nav class="navbar navbar-expand-lg bg-white shadow-sm rounded-4 mb-4 px-4">

<button class="btn btn-primary" id="menuBtn">

<i class="fa-solid fa-bars"></i>

</button>

<div class="ms-auto d-flex align-items-center gap-3">

<button class="btn btn-light position-relative">

<i class="fa-solid fa-bell"></i>

<span class="badge bg-danger position-absolute top-0 start-100 translate-middle">
3
</span>

</button>

<img src="https://ui-avatars.com/api/?name=Admin&background=0d6efd&color=fff"
class="rounded-circle"
width="42">

<strong>Administrator</strong>

</div>

</nav>

<!-- Statistics -->

<div class="row g-4">

<div class="col-md-6 col-xl-3">

<div class="stat-box">

<i class="fa-solid fa-money-bill-wave"></i>

<h3>0 FCFA</h3>

<p>Total Sales</p>

</div>

</div>

<div class="col-md-6 col-xl-3">

<div class="stat-box">

<i class="fa-solid fa-cart-shopping"></i>

<h3>0</h3>

<p>Orders</p>

</div>

</div>

<div class="col-md-6 col-xl-3">

<div class="stat-box">

<i class="fa-solid fa-box"></i>

<h3>0</h3>

<p>Products</p>

</div>

</div>

<div class="col-md-6 col-xl-3">

<div class="stat-box">

<i class="fa-solid fa-users"></i>

<h3>0</h3>

<p>Customers</p>

</div>

</div>

</div>

<!-- Recent Orders -->

<div class="card border-0 shadow-sm rounded-4 mt-5">

<div class="card-header bg-white">

<h4>

<i class="fa-solid fa-clock-rotate-left text-primary"></i>

Recent Orders

</h4>

</div>

<div class="table-responsive">

<table class="table table-hover align-middle mb-0">

<thead>

<tr>

<th>#</th>

<th>Customer</th>

<th>Total</th>

<th>Status</th>

<th>Date</th>

</tr>

</thead>

<tbody id="recentOrders">

<tr>

<td colspan="5" class="text-center text-muted">

No orders yet

</td>

</tr>

</tbody>

</table>

</div>

</div>

</div>

</div>

<script src="js/dashboard.js"></script>
